<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content Studio — Learn SAP Free</title>

  <!-- Netlify Identity Widget (handles email/password login for authors) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <!-- Decap CMS — loaded from CDN, no build step required -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // ──────────────────────────────────────────────────────────────────
    // Handle Netlify Identity redirect after login
    // This makes the "Login with email" flow work properly
    // ──────────────────────────────────────────────────────────────────
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>

</body>
</html>
