# =====================================================
# Decap CMS Configuration — Learn SAP Free
# Backend: Netlify git-gateway + Netlify Identity
# Authors log in with EMAIL + PASSWORD (no GitHub needed)
# =====================================================

backend:
  name: git-gateway
  branch: main

# Netlify Identity handles auth — authors get email invite
# Tu Netlify dashboard se invite karta hai → they set their own password

# Media uploads stored in public/uploads/
media_folder: "public/uploads"
public_folder: "/uploads"

# =====================================================
# BLOG POSTS COLLECTION
# Matches your src/content.config.ts schema exactly
# =====================================================
collections:
  - name: "blog"
    label: "📝 Blog Posts"
    label_singular: "Blog Post"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["pubDate", "title", "category"]
    preview_path: "blog/{{slug}}"

    fields:
      # ── REQUIRED ──────────────────────────────────

      - label: "Article Title"
        name: "title"
        widget: "string"
        hint: "SEO-friendly title (50–60 characters ideal)"

      - label: "Short Description / Excerpt"
        name: "description"
        widget: "text"
        hint: "Used for SEO and blog card preview (120–160 chars ideal)"

      - label: "Published Date"
        name: "pubDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: ""

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "SAP ABAP",          value: "ABAP"    }
          - { label: "SAP Fiori",          value: "Fiori"   }
          - { label: "SAP HANA",           value: "HANA"    }
          - { label: "SAP BTP",            value: "BTP"     }
          - { label: "SAP Basis",          value: "Basis"   }
          - { label: "SAP Career & Jobs",  value: "Career"  }
          - { label: "SAP MM Module",      value: "MM"      }
          - { label: "SAP SD Module",      value: "SD"      }
          - { label: "SAP FICO Module",    value: "FICO"    }
          - { label: "SAP Build & Low-Code", value: "Build" }
          - { label: "SAP AI & Joule",     value: "AI"      }
          - { label: "General SAP",        value: "General" }

      - label: "Author Name"
        name: "author"
        widget: "string"
        default: "Learn SAP Free Team"

      # ── OPTIONAL ──────────────────────────────────

      - label: "Thumbnail Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Upload blog thumbnail — Recommended size: 1200×630 px"

      - label: "Reading Time"
        name: "readingTime"
        widget: "string"
        required: false
        default: "5 min"
        hint: "e.g. '5 min' or '10 min read'"

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        allow_add: true
        hint: "Add relevant tags (press Enter after each)"
        field:
          label: "Tag"
          name: "tag"
          widget: "string"

      - label: "SEO Keywords"
        name: "keywords"
        widget: "list"
        required: false
        allow_add: true
        hint: "Target keywords for Google SEO"
        field:
          label: "Keyword"
          name: "keyword"
          widget: "string"

      - label: "Last Modified Date"
        name: "lastModified"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false

      # ── ARTICLE CONTENT ────────────────────────────
      # Two modes available via toolbar toggle:
      #   Rich Text → Google Docs style (bold, italic, headings, images, lists)
      #   Raw       → paste raw HTML or Markdown directly

      - label: "Article Content"
        name: "body"
        widget: "markdown"
        hint: >
          Use Rich Text mode for normal writing (toolbar available).
          Click the '</>' icon in toolbar to switch to Raw HTML/Markdown mode.
        modes:
          - rich_text
          - raw
        buttons:
          - bold
          - italic
          - title
          - bulleted-list
          - numbered-list
          - quote
          - link
          - code
